<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 text-dark fw-bold">Daftar Pelanggan</h4>
    <button class="btn btn-primary shadow-sm rounded-pill px-4" onclick="openModalPelanggan()">
        <i class="bi bi-person-plus-fill me-1"></i> Tambah Pelanggan
    </button>
</div>

<!-- Pencarian dan Filter -->
<div class="card shadow-sm border-0 mb-4 rounded-4">
    <div class="card-body p-3">
        <div class="row g-3">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchPelanggan" placeholder="Cari nama, instansi, atau WhatsApp..." onkeyup="filterPelanggan()">
                </div>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="filterKategoriPelanggan" onchange="filterPelanggan()">
                    <option value="">Semua Kategori</option>
                    <option value="Umum">Umum</option>
                    <option value="Reseller">Reseller</option>
                    <option value="Perusahaan / Instansi">Perusahaan / Instansi</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- Tabel Pelanggan -->
<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tablePelanggan">
            <thead class="table-light">
                <tr>
                    <th class="ps-4">Nama Pelanggan / PIC</th>
                    <th>Instansi</th>
                    <th>Kontak / WA</th>
                    <th>Kota</th>
                    <th>Kategori</th>
                    <th>Total Belanja</th>
                    <th class="text-end pe-4" style="min-width: 100px;">Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="7" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Memuat...</span>
                        </div>
                        <div class="mt-2 text-muted">Mengambil data pelanggan...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Form Pelanggan -->
<div class="modal fade" id="modalPelanggan" tabindex="-1" aria-labelledby="modalPelangganLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold" id="modalPelangganLabel">Tambah Pelanggan</h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formPelanggan" onsubmit="simpanPelanggan(event)">
                    <input type="hidden" id="pel_id">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small mb-1">Nama / Nama PIC <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="pel_nama" required placeholder="Contoh: Budi Santoso">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small mb-1">Nama Instansi / Toko</label>
                        <input type="text" class="form-control" id="pel_instansi" placeholder="Kosongkan jika perorangan">
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small mb-1">No WhatsApp <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="pel_wa" required placeholder="Contoh: 628123456789" value="62">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small mb-1">Email</label>
                            <input type="email" class="form-control" id="pel_email" placeholder="email@contoh.com">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small mb-1">Kota</label>
                            <input type="text" class="form-control" id="pel_kota" placeholder="Contoh: Yogyakarta">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small mb-1">Kategori <span class="text-danger">*</span></label>
                            <select class="form-select" id="pel_kategori" required>
                                <option value="Umum">Umum</option>
                                <option value="Reseller">Reseller</option>
                                <option value="Perusahaan / Instansi">Perusahaan / Instansi</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small mb-1">Alamat Lengkap</label>
                        <textarea class="form-control" id="pel_alamat" rows="2" placeholder="Detail alamat pengiriman"></textarea>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold" id="btnSimpanPelanggan">
                            <i class="bi bi-save me-1"></i> Simpan Pelanggan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
