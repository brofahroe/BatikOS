<script>
var dataPengguna = [];
var editPenggunaID = null;

async function fetchPengguna() {
    try {
        const res = await requestAPI('read', { sheet: 'Pengguna' });
        if (res.success) {
            dataPengguna = res.data;
            renderPengguna();
        }
    } catch(err) {
        console.error("Gagal memuat pengguna", err);
    }
}

function renderPengguna() {
    const tbody = document.querySelector("#tablePengguna tbody");
    tbody.innerHTML = "";
    if(dataPengguna.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5' class='text-center py-4 text-muted'>Belum ada data pengguna.</td></tr>";
        return;
    }
    
    dataPengguna.forEach(p => {
        let badgeRole = "bg-secondary";
        if(p.Peran === "Pemilik (Owner)") badgeRole = "bg-danger";
        else if(p.Peran === "Admin") badgeRole = "bg-primary";
        else if(p.Peran === "Sales") badgeRole = "bg-success";
        else if(p.Peran === "Staff Produksi") badgeRole = "bg-warning text-dark";
        else if(p.Peran === "Staff Finance") badgeRole = "bg-info text-dark";

        let badgeStatus = p.Status === "Aktif" ? "bg-success" : "bg-danger";

        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="ps-4 fw-semibold"><i class="bi bi-person-circle text-muted me-2"></i> ${p.NamaPengguna}</td>
            <td><span class="badge ${badgeRole}">${p.Peran}</span></td>
            <td><small class="text-muted">${p.TanggalDibuat ? p.TanggalDibuat.split('T')[0] : '-'}</small></td>
            <td><span class="badge ${badgeStatus} bg-opacity-10 text-${p.Status === 'Aktif' ? 'success' : 'danger'} border border-${p.Status === 'Aktif' ? 'success' : 'danger'}">${p.Status}</span></td>
            <td class="text-center pe-4">
                <button class="btn btn-sm btn-outline-primary" onclick="editPengguna('${p.ID}')"><i class="bi bi-pencil"></i> Edit</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function showModalPengguna() {
    editPenggunaID = null;
    document.getElementById('formPengguna').reset();
    document.querySelector('#modalPengguna .modal-title').innerText = "Tambah Pengguna Baru";
    document.getElementById('user_password').required = true;
    document.getElementById('user_nama').disabled = false;
    document.getElementById('lbl_user_password').innerText = "Kata Sandi (Baru)";
    document.getElementById('hint_user_password').innerText = "Password wajib diisi (min. 6 karakter).";
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPengguna')).show();
}

function editPengguna(id) {
    const user = dataPengguna.find(x => x.ID === id);
    if(!user) return;
    
    editPenggunaID = id;
    document.getElementById('user_nama').value = user.NamaPengguna;
    document.getElementById('user_nama').disabled = true; // Jangan boleh ganti username
    document.getElementById('user_password').value = "";
    document.getElementById('user_password').required = false; // Boleh kosong jika tidak diubah
    document.getElementById('user_role').value = user.Peran;
    document.getElementById('user_status').value = user.Status;
    
    document.querySelector('#modalPengguna .modal-title').innerText = "Edit Pengguna";
    document.getElementById('lbl_user_password').innerText = "Kata Sandi (Opsional)";
    document.getElementById('hint_user_password').innerText = "Kosongkan jika tidak ingin mengubah password.";
    
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPengguna')).show();
}

async function savePengguna(event) {
    event.preventDefault();
    const btn = event.target.querySelector('button[type="submit"]');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
    btn.disabled = true;

    const payload = {
        "NamaPengguna": document.getElementById('user_nama').value,
        "Peran": document.getElementById('user_role').value,
        "Status": document.getElementById('user_status').value
    };

    const pwd = document.getElementById('user_password').value;
    if(pwd) {
        if(pwd.length < 6) {
            alert("Kata sandi minimal 6 karakter!");
            btn.innerHTML = 'Simpan Pengguna';
            btn.disabled = false;
            return;
        }
        payload["KataSandi"] = pwd; // Server akan hash ulang
    }

    if(!editPenggunaID) {
        payload["TanggalDibuat"] = new Date().toISOString();
    }

    try {
        let res;
        if(editPenggunaID) {
            res = await requestAPI('update', { sheet: 'Pengguna', id: editPenggunaID, data: payload });
        } else {
            res = await requestAPI('create', { sheet: 'Pengguna', data: payload });
        }
        
        if(res.success) {
            bootstrap.Modal.getInstance(document.getElementById('modalPengguna')).hide();
            await fetchPengguna();
        } else {
            alert(res.message);
        }
    } catch(e) {
        console.error(e);
        alert("Gagal menyimpan data pengguna.");
    }

    btn.innerHTML = 'Simpan Pengguna';
    btn.disabled = false;
}

// Tambahkan fetchPengguna() ke initial loading jika role diizinkan
document.addEventListener('DOMContentLoaded', () => {
    const savedUserStr = getStorage('batikseng_user');
    if (savedUserStr) {
        try {
            const user = JSON.parse(savedUserStr);
            if(user.role === "Admin" || user.role === "Pemilik (Owner)") {
                fetchPengguna();
            }
        } catch(e){}
    }
});
</script>
