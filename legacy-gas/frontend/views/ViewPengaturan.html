<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 text-dark fw-bold">Pengaturan Sistem</h4>
</div>

<div class="row">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold text-primary mb-0"><i class="bi bi-printer me-2"></i> Pengaturan Cetak Nota (Struk)</h5>
            </div>
            <div class="card-body p-4">
                <form id="formPengaturanNota">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small mb-1">Nama Toko</label>
                        <input type="text" class="form-control rounded-3" id="set_nama_toko" placeholder="Batik Nusantara">
                        <div class="form-text">Tampil di bagian paling atas nota cetak.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small mb-1">Alamat Toko</label>
                        <textarea class="form-control rounded-3" id="set_alamat_toko" rows="2" placeholder="Jl. Sudirman No. 123..."></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small mb-1">Nomor Kontak (WhatsApp / Telp)</label>
                        <input type="text" class="form-control rounded-3" id="set_kontak_toko" placeholder="08123456789">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small mb-1">Pesan Penutup (Footer)</label>
                        <textarea class="form-control rounded-3" id="set_pesan_footer" rows="2" placeholder="Barang yang sudah dibeli tidak dapat ditukar."></textarea>
                        <div class="form-text">Pesan akan tercetak di bagian paling bawah nota.</div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="button" class="btn btn-primary rounded-pill fw-bold py-2 shadow-sm" id="btnSimpanPengaturan" onclick="simpanPengaturan()">
                            <i class="bi bi-save me-1"></i> Simpan Pengaturan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
