<!DOCTYPE html>
<html lang="id">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batik Seng - Persetujuan Desain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .hero-banner { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; padding: 2rem 0; text-align: center; }
        .mockup-container { max-width: 600px; margin: -2rem auto 2rem; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; padding: 2rem; }
        .mockup-img { width: 100%; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="hero-banner">
        <h3 class="fw-bold mb-1">Persetujuan Desain Batik</h3>
        <p class="mb-0 opacity-75">Silakan tinjau desain Anda di bawah ini</p>
    </div>

    <div class="container">
        <div class="mockup-container" id="loadingState">
            <div class="text-center py-5">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <h5 class="text-muted">Memuat Data Desain...</h5>
            </div>
        </div>

        <div class="mockup-container" id="contentState" style="display: none;">
            <div class="text-center mb-4">
                <span class="badge bg-secondary mb-2" id="designStatus">Status</span>
                <h4 class="fw-bold text-dark" id="designName">Nama Desain</h4>
                <p class="text-muted small">Model: <span id="designModel" class="text-capitalize fw-medium"></span></p>
            </div>

            <img id="designImage" src="" alt="Mockup Batik" class="mockup-img mb-4">

            <div id="actionArea">
                <h6 class="fw-bold mb-3">Tindakan Anda:</h6>
                
                <div class="mb-3">
                    <label class="form-label small text-muted">Komentar / Catatan (Opsional)</label>
                    <textarea id="txtKomentar" class="form-control" rows="2" placeholder="Masukkan revisi atau catatan jika ada..."></textarea>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-outline-danger w-100 fw-bold" onclick="submitApproval('Rejected')">
                            <i class="bi bi-x-circle me-1"></i> Minta Revisi
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-success w-100 fw-bold shadow-sm" onclick="submitApproval('Approved')">
                            <i class="bi bi-check-circle me-1"></i> Setujui Desain
                        </button>
                    </div>
                </div>
            </div>

            <div id="successArea" style="display: none;" class="text-center py-4">
                <div class="text-success mb-3"><i class="bi bi-check-circle-fill" style="font-size: 3rem;"></i></div>
                <h5 class="fw-bold text-dark">Tanggapan Berhasil Dikirim</h5>
                <p class="text-muted small">Terima kasih. Pengrajin kami akan segera memprosesnya.</p>
            </div>
        </div>
    </div>

    <script>
        const DESIGN_ID = "<?= designId ?>";

        document.addEventListener("DOMContentLoaded", () => {
            google.script.run.withSuccessHandler(onDataLoaded).withFailureHandler(onError).handleClientRequest('getDesignById', { designId: DESIGN_ID });
        });

        function onDataLoaded(res) {
            document.getElementById('loadingState').style.display = 'none';
            if (res.success && res.data) {
                document.getElementById('contentState').style.display = 'block';
                document.getElementById('designName').innerText = res.data.NamaDesain;
                document.getElementById('designModel').innerText = (res.data.ModelPakaian || '').replace('_', ' ');
                document.getElementById('designImage').src = res.data.URLMockup;
                
                const status = res.data.StatusApproval;
                const badge = document.getElementById('designStatus');
                badge.innerText = status;
                if (status === 'Approved') badge.className = 'badge bg-success mb-2';
                else if (status === 'Rejected') badge.className = 'badge bg-danger mb-2';
                else badge.className = 'badge bg-warning text-dark mb-2';

                // Hide actions if already approved
                if (status === 'Approved') {
                    document.getElementById('actionArea').style.display = 'none';
                }
            } else {
                onError("Desain tidak ditemukan atau URL tidak valid.");
            }
        }

        function onError(err) {
            document.getElementById('loadingState').innerHTML = `
                <div class="text-center py-5 text-danger">
                    <i class="bi bi-exclamation-triangle fs-1 mb-3"></i>
                    <h5>Error Memuat Desain</h5>
                    <p class="small text-muted">${err.message || err}</p>
                </div>
            `;
        }

        function submitApproval(status) {
            const komentar = document.getElementById('txtKomentar').value;
            
            // disable buttons
            document.querySelectorAll('#actionArea button').forEach(b => b.disabled = true);
            
            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    document.getElementById('actionArea').style.display = 'none';
                    document.getElementById('successArea').style.display = 'block';
                    document.getElementById('designStatus').innerText = status;
                    document.getElementById('designStatus').className = status === 'Approved' ? 'badge bg-success mb-2' : 'badge bg-danger mb-2';
                } else {
                    alert("Gagal: " + res.message);
                    document.querySelectorAll('#actionArea button').forEach(b => b.disabled = false);
                }
            }).withFailureHandler(err => {
                alert("Kesalahan jaringan: " + err);
                document.querySelectorAll('#actionArea button').forEach(b => b.disabled = false);
            }).handleClientRequest('customerApproveDesign', {
                designId: DESIGN_ID,
                status: status,
                komentar: komentar
            });
        }
    </script>
</body>
</html>
