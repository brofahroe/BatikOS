<script>
var dataPemasok = [];
var dataBahanBaku = [];
var dataMutasi = [];
var dataPO = [];
var currentPOItems = [];
var editPemasokID = null;
var editBahanID = null;
var editPOID = null;

// Memuat data saat diperlukan
async function loadInventaris() {
    await fetchPemasok(); // Harus selesai dulu agar nama Pemasok bisa tampil di Bahan Baku & PO
    await Promise.all([
        fetchBahanBaku(),
        fetchMutasi(),
        fetchPO(),
        fetchProdukJadi()
    ]);
}

async function fetchPemasok() {
    try {
        const res = await requestAPI('read', { sheet: 'Pemasok' });
        if (res.success) {
            dataPemasok = res.data;
            renderPemasok();
            populatePemasokDropdown();
        }
    } catch(err) {
        console.error("Gagal memuat pemasok", err);
    }
}

async function fetchBahanBaku() {
    try {
        const res = await requestAPI('read', { sheet: 'BahanBaku' });
        if (res.success) {
            dataBahanBaku = res.data;
            renderBahanBaku();
            if (typeof populateBahanBakuSelect === 'function') populateBahanBakuSelect();
        }
    } catch(err) {
        console.error("Gagal memuat bahan baku", err);
    }
}

async function fetchMutasi() {
    try {
        const res = await requestAPI('read', { sheet: 'MutasiBahan' });
        if (res.success) {
            dataMutasi = res.data;
            renderMutasi();
        }
    } catch(err) { console.error("Gagal memuat mutasi", err); }
}

async function fetchPO() {
    try {
        const res = await requestAPI('read', { sheet: 'POPembelian' });
        if (res.success) {
            dataPO = res.data;
            renderPO();
        }
    } catch(err) { console.error("Gagal memuat PO", err); }
}

function renderPemasok() {
    const tbody = document.querySelector("#tablePemasok tbody");
    tbody.innerHTML = "";
    if(dataPemasok.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5' class='text-center py-4 text-muted'>Belum ada data pemasok.</td></tr>";
        return;
    }
    
    dataPemasok.forEach(p => {
        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="fw-semibold text-primary">${p["Toko / Supplier"]}</td>
            <td>${p["Nama PIC"] || '-'}</td>
            <td><a href="https://wa.me/${p["WhatsApp"]}" target="_blank" class="text-decoration-none text-success fw-medium"><i class="bi bi-whatsapp"></i> ${p["WhatsApp"]}</a></td>
            <td><small class="text-muted">${p["Alamat"]}</small></td>
            ${(window.currentUserRole === 'Sales' || window.currentUserRole === 'Staff Produksi') ? '' : `
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="editPemasok('${p.ID}')"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteData('Pemasok', '${p.ID}')"><i class="bi bi-trash"></i></button>
            </td>
            `}
        `;
        tbody.appendChild(tr);
    });
}

function populatePemasokDropdown() {
    const selectBB = document.getElementById('bahan_IDPemasok');
    const selectPO = document.getElementById('po_pemasok');
    
    if (selectBB) selectBB.innerHTML = '<option value="">Pilih Pemasok...</option>';
    if (selectPO) selectPO.innerHTML = '<option value="">Pilih Pemasok...</option>';
    
    dataPemasok.forEach(p => {
        if (selectBB) selectBB.innerHTML += `<option value="${p.ID}">${p["Toko / Supplier"]}</option>`;
        if (selectPO) selectPO.innerHTML += `<option value="${p.ID}">${p["Toko / Supplier"]}</option>`;
    });
}

function renderBahanBaku() {
    const tbody = document.querySelector("#tableBahanBaku tbody");
    tbody.innerHTML = "";
    if(dataBahanBaku.length === 0) {
        tbody.innerHTML = "<tr><td colspan='7' class='text-center py-4 text-muted'>Belum ada data bahan baku.</td></tr>";
        return;
    }
    
    dataBahanBaku.forEach(b => {
        const sup = dataPemasok.find(p => p.ID === b["IDPemasok"]);
        const namaSup = sup ? sup["Toko / Supplier"] : '<span class="text-danger">Pemasok Dihapus</span>';

        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td><span class="badge bg-light text-dark border">${b["Kode"]}</span></td>
            <td><span class="badge bg-secondary bg-opacity-10 text-secondary border">${b["Kategori"] || '-'}</span></td>
            <td><div class="fw-semibold">${b["Nama"]}</div><small class="text-muted"><i class="bi bi-shop me-1"></i>${namaSup}</small></td>
            <td><span class="badge bg-white text-primary border border-primary">${b["Satuan Beli"]}</span> <i class="bi bi-arrow-right mx-1 text-muted"></i> <span class="badge bg-white text-success border border-success">${b["Satuan Pakai"]}</span></td>
            <td class="text-center">x ${parseFloat(Number(b["Rasio Konversi"] || 0).toFixed(2))}</td>
            <td>Rp ${parseInt(b["HargaBeli"] || 0).toLocaleString()}</td>
            <td class="text-success fw-medium">Rp ${parseInt(b["HargaJual"] || 0).toLocaleString()}</td>
            <td><span class="fw-bold fs-5 text-dark">${parseFloat(Number(b["StokSaatIni"] || 0).toFixed(2))}</span> <small class="text-muted">${b["Satuan Pakai"]}</small></td>
            ${(window.currentUserRole === 'Sales' || window.currentUserRole === 'Staff Produksi') ? '' : `
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="editBahanBaku('${b.ID}')"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteData('BahanBaku', '${b.ID}')"><i class="bi bi-trash"></i></button>
            </td>
            `}
        `;
        tbody.appendChild(tr);
    });
}

function renderMutasi() {
    const tbody = document.querySelector("#tableMutasi tbody");
    tbody.innerHTML = "";
    if(dataMutasi.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' class='text-center py-4 text-muted'>Belum ada data mutasi.</td></tr>";
        return;
    }
    
    // Reverse array to show latest first
    const mutasiRev = [...dataMutasi].reverse();
    mutasiRev.forEach(m => {
        const bahan = dataBahanBaku.find(b => b.ID === m.IDBahan);
        const namaBahan = bahan ? bahan.Nama : "Bahan Dihapus";
        const satuan = bahan ? bahan["Satuan Pakai"] : "";
        const badgeColor = m.Tipe === "MASUK" ? "bg-success" : "bg-danger";
        const sign = m.Tipe === "MASUK" ? "+" : "-";

        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${m.Tanggal ? new Date(m.Tanggal).toLocaleDateString('id-ID') : '-'}</td>
            <td class="fw-semibold">${namaBahan}</td>
            <td><span class="badge ${badgeColor}">${m.Tipe}</span></td>
            <td class="fw-bold ${m.Tipe === 'MASUK' ? 'text-success' : 'text-danger'}">${sign}${m.PerubahanJumlah} <small class="text-muted fw-normal">${satuan}</small></td>
            <td><span class="badge bg-light text-dark border">${m.IDReferensi}</span></td>
            <td><small class="text-muted">${m.Keterangan}</small></td>
        `;
        tbody.appendChild(tr);
    });
}

function renderPO() {
    const tbody = document.querySelector("#tablePO tbody");
    tbody.innerHTML = "";
    if(dataPO.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' class='text-center py-4 text-muted'>Belum ada data PO.</td></tr>";
        return;
    }
    
    const poRev = [...dataPO].reverse();
    poRev.forEach(po => {
        const sup = dataPemasok.find(p => p.ID === po.IDPemasok);
        const namaSup = sup ? sup["Toko / Supplier"] : "-";
        const isSelesai = po.Status === "Selesai";
        const statusBadge = isSelesai ? "bg-success" : (po.Status === "Proses" ? "bg-warning text-dark" : "bg-secondary");

        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td><span class="fw-bold">${po.NomorPO}</span></td>
            <td>${po.Tanggal ? new Date(po.Tanggal).toLocaleDateString('id-ID') : '-'}</td>
            <td>${namaSup}</td>
            <td class="fw-semibold text-primary">Rp ${parseInt(po.TotalNilai || 0).toLocaleString()}</td>
            <td><span class="badge ${statusBadge}">${po.Status}</span></td>
            <td>
                ${!isSelesai ? `
                    <button class="btn btn-sm btn-outline-primary" onclick="editPO('${po.ID}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteData('POPembelian', '${po.ID}')"><i class="bi bi-trash"></i></button>
                ` : `<i class="bi bi-check-circle-fill text-success fs-5"></i>`}
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// PO Logic
function filterBahanByPemasok() {
    const idPemasok = document.getElementById('po_pemasok').value;
    const select = document.getElementById('po_item_bahan');
    select.innerHTML = '<option value="">Pilih bahan...</option>';
    
    if(!idPemasok) return;
    
    const filtered = dataBahanBaku.filter(b => b.IDPemasok === idPemasok);
    filtered.forEach(b => {
        select.innerHTML += `<option value="${b.ID}" data-harga="${b.HargaBeli}" data-satuan="${b['Satuan Beli']}">${b.Kode} - ${b.Nama} (Rp ${parseInt(b.HargaBeli||0).toLocaleString()}/${b['Satuan Beli']})</option>`;
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const poBahan = document.getElementById('po_item_bahan');
    if (poBahan) {
        poBahan.addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const satuanLabel = document.getElementById('po_item_satuan');
            if(selected && selected.value) {
                satuanLabel.innerText = selected.getAttribute('data-satuan') || "Satuan";
            } else {
                satuanLabel.innerText = "Satuan";
            }
        });
    }
});

function addPOItem() {
    const select = document.getElementById('po_item_bahan');
    const opt = select.options[select.selectedIndex];
    const qty = parseFloat(document.getElementById('po_item_qty').value);
    
    if(!opt.value || !qty || qty <= 0) return alert("Pilih bahan dan masukkan Qty yang valid!");
    
    const idBahan = opt.value;
    const namaBahan = opt.text.split('(')[0].trim();
    const harga = parseFloat(opt.getAttribute('data-harga')) || 0;
    const subtotal = qty * harga;
    
    // Cek duplikat
    const existing = currentPOItems.find(i => i.IDBahan === idBahan);
    if(existing) {
        existing.Jumlah += qty;
        existing.Subtotal = existing.Jumlah * existing.Harga;
    } else {
        currentPOItems.push({
            IDBahan: idBahan,
            Nama: namaBahan,
            Jumlah: qty,
            Harga: harga,
            Subtotal: subtotal
        });
    }
    
    document.getElementById('po_item_qty').value = '';
    renderPOItems();
}

function removePOItem(index) {
    currentPOItems.splice(index, 1);
    renderPOItems();
}

function renderPOItems() {
    const tbody = document.getElementById('tablePODetails').querySelector('tbody');
    const totalDisplay = document.getElementById('po_total_display');
    
    if(currentPOItems.length === 0) {
        tbody.innerHTML = '<tr id="emptyPO"><td colspan="5" class="text-center text-muted py-3">Belum ada item ditambahkan</td></tr>';
        totalDisplay.innerText = "Rp 0";
        return;
    }
    
    tbody.innerHTML = "";
    let grandTotal = 0;
    
    currentPOItems.forEach((item, index) => {
        grandTotal += item.Subtotal;
        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.Nama}</td>
            <td>${item.Jumlah}</td>
            <td>Rp ${item.Harga.toLocaleString()}</td>
            <td class="fw-bold">Rp ${item.Subtotal.toLocaleString()}</td>
            <td><button type="button" class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removePOItem(${index})">&times;</button></td>
        `;
        tbody.appendChild(tr);
    });
    
    totalDisplay.innerText = "Rp " + grandTotal.toLocaleString();
    totalDisplay.setAttribute('data-total', grandTotal);
}

async function savePurchaseOrder(event) {
    const poNomor = document.getElementById('po_nomor').value;
    const poTanggal = document.getElementById('po_tanggal').value;
    const poPemasok = document.getElementById('po_pemasok').value;
    const poStatus = document.getElementById('po_status').value;
    const totalNilai = document.getElementById('po_total_display').getAttribute('data-total') || 0;
    
    if(!poNomor || !poTanggal || !poPemasok) return alert("Nomor PO, Tanggal, dan Pemasok wajib diisi!");
    if(currentPOItems.length === 0) return alert("Tambahkan minimal 1 item Bahan Baku!");
    
    const payload = {
        po: {
            "NomorPO": poNomor,
            "Tanggal": poTanggal,
            "IDPemasok": poPemasok,
            "TotalNilai": parseFloat(totalNilai),
            "Status": poStatus,
            "DibuatOleh": "Admin" 
        },
        details: currentPOItems
    };
    
    if (editPOID) {
        payload.po.ID = editPOID;
    }
    
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memproses...';
    btn.disabled = true;

    try {
        let res;
        if (editPOID) {
            res = await requestAPI('updatePO', payload);
        } else {
            res = await requestAPI('createPO', payload);
        }
        
        if(res.success) {
            document.getElementById('formPO').reset();
            currentPOItems = [];
            editPOID = null;
            document.querySelector('#modalPO .modal-title').innerText = "Form Purchase Order Baru";
            renderPOItems();
            bootstrap.Modal.getInstance(document.getElementById('modalPO')).hide();
            
            await fetchPO(); 
            if(poStatus === "Selesai") {
                await fetchMutasi();
                await fetchBahanBaku(); // refresh stok
            }
            
            // Tambahkan juga Pemasok ke dropdown PO selanjutnya
            document.getElementById('po_pemasok').value = '';
            filterBahanByPemasok();
        } else {
            alert(res.message);
        }
    } catch(e) { alert("Error: " + e.message); }
    
    btn.innerHTML = originalText;
    btn.disabled = false;
}

async function editPO(id) {
    const po = dataPO.find(x => x.ID === id);
    if(!po) return;
    
    editPOID = id;
    document.getElementById('po_nomor').value = po.NomorPO || "";
    document.getElementById('po_tanggal').value = po.Tanggal ? po.Tanggal.split('T')[0] : "";
    document.getElementById('po_pemasok').value = po.IDPemasok || "";
    filterBahanByPemasok();
    document.getElementById('po_status').value = po.Status || "Draft";
    
    document.querySelector('#modalPO .modal-title').innerText = "Edit Purchase Order";
    const btn = document.querySelector('#modalPO .btn-primary');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memuat item...';
    btn.disabled = true;
    
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPO')).show();
    
    try {
        const res = await requestAPI('readPODetails', { poId: id });
        if(res.success) {
            currentPOItems = res.data.map(d => {
                const bb = dataBahanBaku.find(b => b.ID === d.IDBahan);
                return {
                    IDBahan: d.IDBahan,
                    Nama: bb ? bb.Nama : "Unknown",
                    Jumlah: parseFloat(d.Jumlah) || 0,
                    Harga: parseFloat(d.Harga) || 0,
                    Subtotal: parseFloat(d.Subtotal) || 0
                };
            });
            renderPOItems();
        }
    } catch(e) {
        console.error(e);
        currentPOItems = [];
        renderPOItems();
    }
    
    btn.innerHTML = 'Simpan PO';
    btn.disabled = false;
}

async function savePemasok(event) {
    const data = {
        "Toko / Supplier": document.getElementById('sup_toko').value,
        "Nama PIC": document.getElementById('sup_pic').value,
        "WhatsApp": document.getElementById('sup_wa').value,
        "Email": document.getElementById('sup_email').value,
        "Alamat": document.getElementById('sup_alamat').value
    };
    
    if(!editPemasokID) {
        data["TanggalDibuat"] = new Date().toISOString();
    }
    
    if(!data["Toko / Supplier"] || !data["WhatsApp"]) return alert("Nama Toko dan WA wajib diisi!");
    
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
    btn.disabled = true;

    try {
        let res;
        if(editPemasokID) {
            res = await requestAPI('update', { sheet: 'Pemasok', id: editPemasokID, data: data });
        } else {
            res = await requestAPI('create', { sheet: 'Pemasok', data: data });
        }
        
        if(res.success) {
            document.getElementById('formPemasok').reset();
            editPemasokID = null;
            document.querySelector('#modalPemasok .modal-title').innerText = "Form Pemasok";
            bootstrap.Modal.getInstance(document.getElementById('modalPemasok')).hide();
            await fetchPemasok(); 
        } else {
            alert(res.message);
        }
    } catch(e) { alert("Error: " + e.message); }
    
    btn.innerHTML = originalText;
    btn.disabled = false;
}

function editPemasok(id) {
    const p = dataPemasok.find(x => x.ID === id);
    if(!p) return;
    
    editPemasokID = id;
    document.getElementById('sup_toko').value = p["Toko / Supplier"] || "";
    document.getElementById('sup_pic').value = p["Nama PIC"] || "";
    document.getElementById('sup_wa').value = p["WhatsApp"] || "";
    document.getElementById('sup_email').value = p["Email"] || "";
    document.getElementById('sup_alamat').value = p["Alamat"] || "";
    
    document.querySelector('#modalPemasok .modal-title').innerText = "Edit Pemasok";
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPemasok')).show();
}

async function saveBahanBaku(event) {
    const data = {
        "Kode": document.getElementById('bahan_Kode').value,
        "Nama": document.getElementById('bahan_Nama').value,
        "Kategori": document.getElementById('bahan_Kategori').value,
        "IDPemasok": document.getElementById('bahan_IDPemasok').value,
        "Satuan Beli": document.getElementById('bahan_SatuanBeli').value,
        "Satuan Pakai": document.getElementById('bahan_SatuanPakai').value,
        "Rasio Konversi": document.getElementById('bahan_Rasio').value,
        "HargaBeli": document.getElementById('bahan_HargaBeli').value,
        "HargaJual": document.getElementById('bahan_HargaJual').value || 0,
        "StokMinimum": document.getElementById('bahan_StokMinimum').value
    };
    
    if(!editBahanID) {
        data["StokSaatIni"] = 0;
    } else {
        const b = dataBahanBaku.find(x => x.ID === editBahanID);
        if(b) data["StokSaatIni"] = b["StokSaatIni"]; // Pertahankan stok lama saat update
    }
    
    if(!data["Kode"] || !data["Nama"] || !data["IDPemasok"]) return alert("Kode, Nama, dan Pemasok wajib diisi!");
    
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
    btn.disabled = true;

    try {
        let res;
        if(editBahanID) {
            res = await requestAPI('update', { sheet: 'BahanBaku', id: editBahanID, data: data });
        } else {
            res = await requestAPI('create', { sheet: 'BahanBaku', data: data });
        }
        
        if(res.success) {
            document.getElementById('formBahanBaku').reset();
            editBahanID = null;
            document.querySelector('#modalBahanBaku .modal-title').innerText = "Tambah Bahan Baku";
            bootstrap.Modal.getInstance(document.getElementById('modalBahanBaku')).hide();
            await fetchBahanBaku(); 
        } else {
            alert(res.message);
        }
    } catch(e) { alert("Error: " + e.message); }
    
    btn.innerHTML = originalText;
    btn.disabled = false;
}

function editBahanBaku(id) {
    const b = dataBahanBaku.find(x => x.ID === id);
    if(!b) return;
    
    editBahanID = id;
    document.getElementById('bahan_Kode').value = b["Kode"] || "";
    document.getElementById('bahan_Nama').value = b["Nama"] || "";
    document.getElementById('bahan_Kategori').value = b["Kategori"] || "";
    document.getElementById('bahan_IDPemasok').value = b["IDPemasok"] || "";
    document.getElementById('bahan_SatuanBeli').value = b["Satuan Beli"] || "";
    document.getElementById('bahan_SatuanPakai').value = b["Satuan Pakai"] || "";
    document.getElementById('bahan_Rasio').value = b["Rasio Konversi"] || "";
    document.getElementById('bahan_HargaBeli').value = b["HargaBeli"] || "";
    document.getElementById('bahan_HargaJual').value = b["HargaJual"] || "";
    document.getElementById('bahan_StokMinimum').value = b["StokMinimum"] || "0";
    
    document.querySelector('#modalBahanBaku .modal-title').innerText = "Edit Bahan Baku";
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalBahanBaku')).show();
}

async function deleteData(sheet, id) {
    if(!await window.confirmAsync("Yakin ingin menghapus data ini secara permanen?")) return;
    try {
        const res = await requestAPI('delete', { sheet: sheet, id: id });
        if(res.success) {
            if(sheet === 'Pemasok') await fetchPemasok();
            if(sheet === 'BahanBaku') await fetchBahanBaku();
            if(sheet === 'POPembelian') await fetchPO();
        } else {
            alert(res.message);
        }
    } catch(e) { alert("Error: " + e.message); }
}

document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        if(getStorage('batikseng_token')) {
            loadInventaris();
        }
    }, 500);
});

// DAFTAR PRODUK JADI (TAB PRODUK JADI)

var dataProdukJadiCache = [];

async function fetchProdukJadi() {
    const tbody = document.querySelector('#tableProdukJadi tbody');
    if(!tbody) return;
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data...</td></tr>';
    try {
        const res = await requestAPI('read', { sheet: 'InventarisProduk' });
        if(res.success) {
            dataProdukJadiCache = res.data;
            tbody.innerHTML = '';
            if(res.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Belum ada produk jadi.</td></tr>';
                return;
            }
            res.data.forEach((p, idx) => {
                const url = p.ImageURL || '';
                const imgTag = url ? `<img src="${url}" class="rounded shadow-sm" style="width:50px; height:50px; object-fit:cover;">` : `<div class="bg-light rounded d-flex align-items-center justify-content-center border" style="width:50px; height:50px;"><i class="bi bi-box-seam text-muted"></i></div>`;
                
                tbody.innerHTML += `
                    <tr>
                        <td>${imgTag}</td>
                        <td class="fw-bold">${p.SKU}</td>
                        <td>${p.NamaProduk}</td>
                        <td><span class="badge bg-secondary">${p.Kategori}</span></td>
                        <td>Rp ${parseFloat(p.HargaJual || 0).toLocaleString('id-ID')}</td>
                        <td><span class="badge ${p.StokSaatIni <= 0 ? 'bg-danger' : 'bg-success'}">${p.StokSaatIni}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary py-0" onclick="openEditProduk(${idx})">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                        </td>
                    </tr>
                `;
            });
        }
    } catch(e) { console.error(e); }
}

function openEditProduk(index) {
    const p = dataProdukJadiCache[index];
    if(!p) return;
    
    document.getElementById('edit_prd_id').value = p.ID;
    document.getElementById('edit_prd_sku').value = p.SKU;
    document.getElementById('edit_prd_nama').value = p.NamaProduk;
    document.getElementById('edit_prd_kategori').value = p.Kategori;
    document.getElementById('edit_prd_harga').value = p.HargaJual;
    document.getElementById('edit_prd_image').value = p.ImageURL || '';
    
    // Setup event listener for live preview
    const imgInput = document.getElementById('edit_prd_image');
    const previewCont = document.getElementById('preview_prd_image_container');
    const previewImg = document.getElementById('preview_prd_image');
    
    const updatePreview = () => {
        if(imgInput.value) {
            previewCont.classList.remove('d-none');
            previewImg.src = imgInput.value;
            previewImg.onerror = () => { previewCont.classList.add('d-none'); };
        } else {
            previewCont.classList.add('d-none');
        }
    };
    
    imgInput.oninput = updatePreview;
    updatePreview();
    
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditProduk')).show();
}

async function saveProduk(e) {
    e.preventDefault();
    const btn = e.target;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';
    btn.disabled = true;

    const payload = {
        SKU: document.getElementById('prd_sku').value,
        NamaProduk: document.getElementById('prd_nama').value,
        Kategori: document.getElementById('prd_kategori').value,
        StokSaatIni: parseFloat(document.getElementById('prd_stok').value) || 0,
        HargaPokok: parseFloat(document.getElementById('prd_hpp').value) || 0,
        HargaJual: parseFloat(document.getElementById('prd_harga').value) || 0,
        ImageURL: document.getElementById('prd_image').value
    };

    try {
        const res = await requestAPI('create', { sheet: 'InventarisProduk', data: payload });
        if(res.success) {
            bootstrap.Modal.getInstance(document.getElementById('modalProduk')).hide();
            fetchProdukJadi();
            document.getElementById('formProduk').reset();
        } else {
            alert('Gagal: ' + res.message);
        }
    } catch(err) { alert('Error: ' + err.message); }

    btn.innerHTML = 'Simpan Produk';
    btn.disabled = false;
}

async function saveEditProduk(e) {
    e.preventDefault();
    const id = document.getElementById('edit_prd_id').value;
    const btn = e.target;
    const originalText = btn.innerHTML;
    
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
    btn.disabled = true;
    
    const payload = {
        NamaProduk: document.getElementById('edit_prd_nama').value,
        Kategori: document.getElementById('edit_prd_kategori').value,
        HargaJual: document.getElementById('edit_prd_harga').value,
        ImageURL: document.getElementById('edit_prd_image').value
    };
    
    try {
        const res = await requestAPI('update', { sheet: 'InventarisProduk', id: id, data: payload });
        if(res.success) {
            bootstrap.Modal.getInstance(document.getElementById('modalEditProduk')).hide();
            fetchProdukJadi();
        } else {
            alert("Gagal: " + res.message);
        }
    } catch(err) {
        alert("Error: " + err.message);
    }
    
    btn.innerHTML = originalText;
    btn.disabled = false;
}
</script>
